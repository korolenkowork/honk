# Builds Honk and runs its tests on Linux, macOS and Windows: in-process
# with the JIT, and as native builds, threads and HTTPS included.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Honk's Windows code (Winsock, WSAPoll, SRW locks, LoadLibrary) has not
    # been run before, so a failure there is reported without failing CI.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Goose
        run: .github/scripts/install-goose.sh

      - name: Tests, in-process
        run: goose tests/test_honk.goose

      - name: Tests, native build
        run: |
          mkdir -p build
          goose build -o build/test_honk tests/test_honk.goose
          build/test_honk

      - name: Thread tests, native build
        run: |
          goose build -o build/test_threads tests/test_threads.goose
          build/test_threads

      - name: Build the examples
        run: |
          for f in examples/*.goose; do goose build -o "build/$(basename "$f" .goose)" "$f"; done

      - name: HTTPS smoke test
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew list openssl@3 >/dev/null || brew install openssl@3; fi
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost,IP:127.0.0.1 -keyout build/key.pem -out build/cert.pem
          build/https build/cert.pem build/key.pem &
          for i in $(seq 50); do curl -sf --cacert build/cert.pem https://localhost:8443/ && break; sleep 0.2; done
          curl -sf --cacert build/cert.pem https://localhost:8443/ | grep -q '"secure":true'
          kill %1
